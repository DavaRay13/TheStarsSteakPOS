<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - The Stars Steak</title>
    <link rel="stylesheet" href="css/pos.css">
</head>
<body>

    <div class="pos-container">
        <div class="menu-container">
            <header class="pos-header">
                <h2>The Stars Steak POS</h2>
                <div class="user-info">
                    <span>Kasir: <span id="user-display">...</span></span>
                    <button id="logout-button" class="btn-logout">Logout</button>
                </div>
            </header>
            
            <nav class="category-nav" id="category-tabs">
                </nav>
            
            <main class="menu-grid" id="menu-grid">
                <p>Memuat menu...</p>
            </main>
        </div>

        <aside class="cart-container">
            <h3>Keranjang</h3>
            <div class="cart-items" id="cart-items">
                <p class="cart-empty">Keranjang kosong</p>
            </div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">Rp 0</span>
                </div>
                <div class="summary-row">
                    <span>Pajak (11%)</span>
                    <span id="cart-tax">Rp 0</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">Rp 0</span>
                </div>
                <button class="btn-pay" id="pay-button" disabled>Bayar</button>
            </div>
        </aside>
    </div>

    <div id="modifier-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content-small">
            <span class="modal-close" data-target="modifier-modal">&times;</span>
            <h2 id="modal-item-name">Pilih Opsi</h2>
            <form id="modifier-form">
                </form>
            <button class="btn-pay" id="add-to-cart-button">Tambah ke Keranjang</button>
        </div>
    </div>
    
    <div id="payment-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content-large">
            <span class="modal-close" data-target="payment-modal">&times;</span>
            <h2>Pembayaran</h2>
            <div class="payment-layout">
                <div class="payment-total">
                    <h3>Total Tagihan</h3>
                    <h1 id="payment-total-display">Rp 0</h1>
                    <h3 id="payment-due-display" class="text-danger">Sisa: Rp 0</h3>
                </div>
                <div class="payment-inputs">
                    <h4>Tambah Pembayaran (Split Bill)</h4>
                    <form id="add-payment-form">
                        <div class="form-group">
                            <label for="payment-method">Metode</label>
                            <select id="payment-method">
                                <option value="cash">Tunai (Cash)</option>
                                <option value="qris">QRIS</option>
                                <option value="card">Kartu (Card)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="payment-amount">Jumlah Bayar</label>
                            <input type="number" id="payment-amount" min="0" step="1000" placeholder="... (kosong = bayar lunas)">
                        </div>
                        <button type="submit" class="btn-add-payment">Tambah Pembayaran</button>
                    </form>
                    <hr>
                    <h4>Pembayaran Diterima:</h4>
                    <ul id="payment-list">
                        </ul>
                    <button class="btn-pay" id="process-checkout-button" disabled>
                        Selesaikan Transaksi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/pos.js"></script>
</body>
</html>
